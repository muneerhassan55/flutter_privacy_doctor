name: flutter_privacy_doctor
description: Audit Flutter dependencies for App Store privacy manifest (PrivacyInfo.xcprivacy) and Google Play Data Safety compliance.
version: 1.0.0
homepage: https://github.com/your-username/flutter_privacy_doctor
topics:
  - privacy
  - privacy-manifest
  - app-store
  - play-store
  - data-safety
  - compliance
  - ios
  - android
  - cli

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  path: ^1.8.3
  yaml: ^3.1.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.9

executables:
  flutter_privacy_doctor:
